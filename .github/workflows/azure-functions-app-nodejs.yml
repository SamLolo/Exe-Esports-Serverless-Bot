# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App

on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '24.x'

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Project Dependencies
        shell: pwsh
        run: npm install

      - name: Build Project
        shell: pwsh
        run: npm run build

      - name: Upload Artifact For Deployment
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: .


  Deploy-To-Azure:
    runs-on: ubuntu-latest
    needs: Build
    permissions:
      id-token: write

    steps:
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: node-app
      
      - name: 'Log in to Azure with AZ CLI'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} 
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions App
        uses: Azure/functions-action@v1
        id: deploy-to-function-app
        with:
          app-name: 'exe-dc-bot'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}


  Post-Deploy:
    runs-on: ubuntu-latest
    needs: Deploy-To-Azure

    steps:
    - name: Wait For Function App
      run: sleep 30s
      shell: bash

    - name: Send Sync Request
      id: sync-request
      uses: fjogeleit/http-request-action@v2
      with:
        url: 'https://exe-dc-bot.azurewebsites.net/api/sync'
        method: 'POST'
        timeout: 60000

    - name: Check Commands Synced Correctly
      uses: prompt/actions-assert@v5
      with:
        assertion: npm://@assertions/is-equal:v1
        actual: "${{ steps.sync-request.outputs.status }}"
        expected: 200